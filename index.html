<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Secure Temp Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="chat"></div>
  <input id="input" placeholder="输入消息 回车发送">
</div>

<script>
/* ========= 用户名（仅本地） ========= */
let username = localStorage.getItem('username');
if (!username) {
  username = prompt('取一个用户名');
  localStorage.setItem('username', username);
}

/* ========= 房间 ID ========= */
let roomId = location.hash.slice(1);
if (!roomId) {
  roomId = crypto.randomUUID().slice(0, 8);
  location.hash = roomId;
}

/* ========= WebSocket ========= */
const ws = new WebSocket(`wss://${location.host}`);
const myId = crypto.randomUUID();

/* ========= 加密 ========= */
let keyPair;
const sharedKeys = new Map();
const enc = new TextEncoder();
const dec = new TextDecoder();

async function initCrypto() {
  keyPair = await crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' },
    true,
    ['deriveKey']
  );

  const pub = await crypto.subtle.exportKey('jwk', keyPair.publicKey);

  ws.send(JSON.stringify({
    type: 'key',
    roomId,
    senderId: myId,
    pub
  }));
}

async function derive(pubJwk, senderId) {
  const pubKey = await crypto.subtle.importKey(
    'jwk',
    pubJwk,
    { name: 'ECDH', namedCurve: 'P-256' },
    true,
    []
  );

  const key = await crypto.subtle.deriveKey(
    { name: 'ECDH', public: pubKey },
    keyPair.privateKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );

  sharedKeys.set(senderId, key);
}

async function encrypt(text, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const buf = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key,
    enc.encode(text)
  );
  return { iv: [...iv], data: [...new Uint8Array(buf)] };
}

async function decrypt(payload, key) {
  const buf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: new Uint8Array(payload.iv) },
    key,
    new Uint8Array(payload.data)
  );
  return dec.decode(buf);
}

/* ========= 通信 ========= */
ws.onopen = initCrypto;

ws.onmessage = async e => {
  const msg = JSON.parse(e.data);

  if (msg.type === 'key') {
    await derive(msg.pub, msg.senderId);
  }

  if (msg.type === 'msg') {
    const key = sharedKeys.get(msg.senderId);
    if (!key) return;
    const text = await decrypt(msg.payload, key);
    addMsg(text, false);
  }
};

input.onkeydown = async e => {
  if (e.key !== 'Enter' || !input.value) return;

  const text = `${username}: ${input.value}`;

  for (const key of sharedKeys.values()) {
    const payload = await encrypt(text, key);
    ws.send(JSON.stringify({
      type: 'msg',
      roomId,
      senderId: myId,
      payload
    }));
  }

  addMsg(text, true);
  input.value = '';
};

function addMsg(text, me) {
  const div = document.createElement('div');
  div.className = `msg ${me ? 'me' : ''}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
